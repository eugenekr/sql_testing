services:
  postgres-sandbox:
    image: postgres:15-alpine
    container_name: sql_qa_sandbox
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: qa_learning
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_learning"]
      interval: 5s
      timeout: 5s
      retries: 5